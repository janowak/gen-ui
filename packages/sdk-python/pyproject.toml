[project]
name = "app-mcp-sdk"
version = "0.2.0"
description = "app-mcp for Python MCP servers: forms, charts and registry components as MCP Apps, served by app-mcp."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.9",
    "uvicorn>=0.31",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
