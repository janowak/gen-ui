[project]
name = "genui-sdk"
version = "0.1.0"
description = "genui for Python MCP servers: forms, charts and registry components as MCP Apps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
    "jsonschema>=4.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.9",
    "uvicorn>=0.31",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genui"]
# Copied from @genui/format and @genui/ui by scripts/sync_assets.py; git-ignored, so list them explicitly.
artifacts = ["src/genui/_assets/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/genui/_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
