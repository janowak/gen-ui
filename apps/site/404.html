<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · app-mcp</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Before first paint: the saved theme or the system's, like index.html
      let theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch {}
      document.documentElement.classList.toggle("dark", theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
    </script>
    <script type="module" src="/src/not-found.ts"></script>
  </head>
  <body class="flex min-h-dvh flex-col antialiased">
    <header class="border-b">
      <div class="mx-auto flex h-14 max-w-6xl items-center gap-6 px-4 sm:px-6">
        <a class="flex items-center gap-2 font-semibold tracking-tight" href="/" aria-label="app-mcp home">
          <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="fill-foreground" x="2" y="3" width="20" height="18" rx="5" />
            <rect class="fill-background" x="6" y="8" width="12" height="3" rx="1.5" />
            <rect class="fill-background" x="6" y="13.5" width="7" height="3" rx="1.5" />
          </svg>
          app-mcp
        </a>
        <button class="btn btn-ghost ml-auto w-8 px-0" type="button" aria-label="Switch to dark theme" data-theme-toggle>
          <svg
            class="dark:hidden"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
          <svg
            class="hidden dark:block"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </button>
      </div>
    </header>

    <main class="mx-auto flex w-full max-w-6xl flex-1 flex-col justify-center px-4 py-20 sm:px-6" id="main">
      <p class="text-sm font-medium text-muted-foreground">404</p>
      <h1 class="mt-3 text-3xl font-semibold tracking-tight text-balance sm:text-4xl">This page doesn't exist</h1>
      <p class="mt-3 max-w-xl text-lg text-muted-foreground">The link may be out of date, or the address has a typo.</p>
      <div class="mt-8">
        <a class="btn btn-lg" href="/">Go to the home page</a>
      </div>
    </main>

    <footer class="border-t">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-2 px-4 py-8 text-sm text-muted-foreground sm:px-6">
        <span class="font-semibold tracking-tight text-foreground">app-mcp</span>
        <span>Forms, charts and components for MCP Apps.</span>
      </div>
    </footer>
  </body>
</html>
