# Self-hosted app-mcp: the registry on SQLite, its data in the app-mcp-data volume.
#   cp registry.env.example registry.env   # then fill it in
#   docker compose up -d
#   docker compose logs registry            # the first start prints an admin token
services:
  registry:
    build:
      context: .
      dockerfile: apps/registry/Dockerfile
    image: app-mcp-registry
    env_file: registry.env
    ports:
      - "4000:4000"
    volumes:
      - app-mcp-data:/data
    restart: unless-stopped

volumes:
  app-mcp-data:
